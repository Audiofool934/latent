[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "latent-photo"
version = "0.2.1"
description = "A macOS workspace for browsing, searching, and curating a large personal photo archive"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "clouddrive2-client==0.3.0",
  "numpy>=2.4,<3",
  "pillow>=11.3,<13",
]

[project.urls]
Repository = "https://github.com/Audiofool934/latent"

[project.scripts]
latent = "latent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/latent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
