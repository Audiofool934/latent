# The sample archive on the project page.
# site/prepare.py reads this file, finds each photo in the folder it is given,
# and ranks every photo for every search with Latent's on-device engine.

# The search the page opens with.
first = "cold and quiet"

# The photo cropped for link previews.
link_preview = "DSC09685"

# Each search runs exactly as typed. A query that is not in English has its language
# and a note that explains it.
[[searches]]
text = "cold and quiet"

[[searches]]
text = "fog over the hills"

[[searches]]
text = "a city at night"

[[searches]]
text = "the sun low over water"

[[searches]]
text = "trees without leaves"

[[searches]]
text = "power lines"

[[searches]]
text = "harvest"

[[searches]]
text = "un gato"
lang = "es"
note = "Spanish for a cat"

[[searches]]
text = "花火"
lang = "ja"
note = "Japanese for fireworks"

[[searches]]
text = "夜空"
lang = "zh"
note = "Chinese for the night sky"

